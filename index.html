<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZRI SNACK - Aneka Kue Basah & Snack Box Premium</title>

  <!-- Konfigurasi PWA & Web App Meta -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f59e0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AZRI SNACK">
  <link rel="apple-touch-icon" href="./logo.png">
  <link rel="icon" type="image/png" href="./logo.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Font Poppins & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- LANGKAH 1: CDN GSAP, ScrollTrigger & Lenis Smooth Scroll -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            cream: { 50:'#FDFBF6', 100:'#FAF5EC', 200:'#F1E7D6', 300:'#E3D3B8', 400:'#CBB38C' },
            ink: { 900:'#1C1917', 800:'#292524', 700:'#44403C', 600:'#57534E', 500:'#78716C', 400:'#A8A29E', 300:'#D6D3D1', 200:'#E7E5E4', 100:'#F5F5F4' },
            gold: { 50:'#FDF6EA', 100:'#F8E8CC', 200:'#EFD09B', 300:'#E2B365', 400:'#D19434', 500:'#B87516', 600:'#9A5B0F', 700:'#7C4608', 800:'#5C3306' }
          },
          boxShadow: {
            soft: '0 1px 2px rgba(28,25,23,.04), 0 18px 40px -28px rgba(28,25,23,.35)',
            lift: '0 2px 4px rgba(28,25,23,.05), 0 30px 60px -34px rgba(28,25,23,.5)',
            glow: '0 14px 34px -14px rgba(154,91,15,.45)'
          }
        }
      }
    }
  </script>

  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] { -moz-appearance: textfield; }
    html { scroll-behavior: smooth; }

    /* CSS tambahan untuk efek smooth scroll & lenis */
    html.lenis, html.lenis body {
      height: auto;
    }
    .lenis.lenis-smooth {
      scroll-behavior: auto !important;
    }
    .lenis.lenis-smooth [data-lenis-prevent] {
      overscroll-behavior: contain;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.3); }
      50% { transform: scale(1.04); box-shadow: 0 0 45px rgba(245, 158, 11, 0.6); }
    }
    .animate-pulse-glow {
      animation: pulseGlow 2.2s infinite ease-in-out;
    }
    @keyframes shimmerBar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    .animate-shimmer {
      animation: shimmerBar 1.5s infinite linear;
    }

    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .hero-surface {
      background:
        radial-gradient(120% 130% at 12% 0%, rgba(255,238,206,0.22) 0%, rgba(255,238,206,0) 55%),
        linear-gradient(135deg, #7C4608 0%, #9A5B0F 48%, #B87516 100%);
    }
    .texture-dots {
      background-image: radial-gradient(rgba(255,255,255,0.16) 1px, transparent 1px);
      background-size: 14px 14px;
    }
    .rule-gold {
      background: linear-gradient(90deg, transparent, #E2B365 20%, #E2B365 80%, transparent);
      height: 1px;
    }
  </style>
</head>
<body class="bg-cream-100 text-ink-800 pb-36 min-h-screen selection:bg-gold-500 selection:text-white">

  <!-- ================= PRELOAD / SPLASH SCREEN PEMBUKA ================= -->
  <div id="app-preload-screen" class="fixed inset-0 z-50 bg-[#faf8f5] flex flex-col items-center justify-center p-6 transition-all duration-700">
    <div class="flex flex-col items-center text-center max-w-xs w-full space-y-6">
      <div class="relative">
        <div class="absolute -inset-2 bg-gradient-to-r from-amber-400 via-orange-400 to-amber-500 rounded-full blur-md opacity-70 animate-pulse"></div>
        <div class="relative w-28 h-28 rounded-full bg-white p-1 shadow-2xl animate-pulse-glow flex items-center justify-center overflow-hidden border border-amber-200/80">
          <div class="w-full h-full bg-gradient-to-br from-amber-50 to-orange-50 rounded-full flex items-center justify-center overflow-hidden p-1">
            <span id="preload-logo-fallback" class="text-5xl">🍰</span>
            <img id="preload-logo-img" src="./logo.png" alt="AZRI SNACK" class="w-full h-full object-cover rounded-full hidden" onerror="this.classList.add('hidden'); document.getElementById('preload-logo-fallback').classList.remove('hidden');">
          </div>
        </div>
      </div>

      <div class="space-y-1">
        <h1 class="font-serif font-bold text-2xl text-gray-900 tracking-tight">AZRI SNACK</h1>
        <p class="text-xs text-amber-700 font-medium tracking-wide">Kue Tradisional & Snack Box</p>
      </div>

      <div class="w-full space-y-2.5 pt-2">
        <div class="w-48 h-2 bg-amber-100 rounded-full overflow-hidden mx-auto relative shadow-inner">
          <div id="preload-progress-bar" class="h-full bg-gradient-to-r from-amber-500 to-orange-500 rounded-full w-1/3 transition-all duration-500"></div>
          <div class="absolute inset-0 bg-white/40 w-1/2 animate-shimmer"></div>
        </div>
        <p id="preload-status-text" class="text-[11px] text-gray-400 font-medium animate-pulse">
          <i class="fa-solid fa-cookie text-amber-500 mr-1"></i> Menyiapkan sajian fresh...
        </p>
      </div>
    </div>
    <div class="absolute bottom-6 text-center text-[10px] text-gray-400 font-medium">
      Dibuat Fresh Setiap Hari • Sejak 2026
    </div>
  </div>

  <!-- Banner PWA Install -->
  <div id="pwa-install-banner" class="hidden bg-gray-900 text-white px-4 py-2.5 shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3 text-xs">
      <div class="flex items-center gap-2">
        <span class="text-base">📱</span>
        <span>Pasang aplikasi <strong>AZRI SNACK</strong> di layar utama HP Anda!</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="triggerPWAInstall()" class="bg-amber-500 hover:bg-amber-600 font-bold px-3 py-1.5 rounded-xl shadow-xs transition active:scale-95">
          Pasang App
        </button>
        <button onclick="dismissPWABanner()" class="text-gray-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= HEADER UTAMA (STICKY TETAP DI ATAS SAAT SCROLL) ================= -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-cream-200 shadow-soft">
    <!-- Baris 1: Logo, Nama, No WA, Keranjang -->
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex items-center justify-between border-b border-cream-100/60">
      <div class="flex items-center gap-3">
        <div id="store-logo-container" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-gradient-to-br from-gold-400 via-gold-500 to-gold-700 p-[2px] shadow-glow flex-shrink-0 flex items-center justify-center overflow-hidden ring-2 ring-gold-600/30">
          <div class="w-full h-full bg-white rounded-full flex items-center justify-center overflow-hidden p-0.5">
            <span id="store-logo-fallback" class="text-base">🍰</span>
            <img id="store-logo-img" src="./logo.png" alt="Logo AZRI SNACK" class="w-full h-full object-cover rounded-full hidden" onerror="this.classList.add('hidden'); document.getElementById('store-logo-fallback').classList.remove('hidden');">
          </div>
        </div>
        <div>
          <h1 class="font-serif font-bold text-base sm:text-lg text-gray-900 leading-none tracking-tight">AZRI SNACK</h1>
          <p class="text-[8px] sm:text-[9px] text-gold-600 font-semibold uppercase tracking-[0.18em] mt-0.5">Kue Tradisional & Snack Box</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <button onclick="openDirectWhatsApp('Halo Admin AZRI SNACK, saya ingin bertanya tentang menu kue.')" class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full text-xs font-semibold hover:bg-emerald-100 transition border border-emerald-200/60 shadow-2xs">
          <i class="fa-brands fa-whatsapp text-sm"></i>
          <span class="hidden sm:inline">0858-9202-2079</span>
          <span class="sm:hidden">WhatsApp</span>
        </button>
        
        <button onclick="toggleCartModal(true)" class="relative p-2.5 bg-cream-100 rounded-2xl text-gold-700 hover:bg-cream-200/80 transition border border-cream-200 shadow-soft active:scale-95 focus:outline-none">
          <i class="fa-solid fa-basket-shopping text-base"></i>
          <span id="cart-badge" class="absolute -top-1 -right-1 bg-gold-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-md ring-2 ring-white hidden">0</span>
        </button>
      </div>
    </div>

    <!-- Baris 2: Pilihan Menu Kategori & Kolom Pencarian -->
    <div class="max-w-7xl mx-auto px-4 py-2 bg-white/90 backdrop-blur-md space-y-2">
      <div class="flex gap-2 overflow-x-auto hide-scrollbar">
        <button onclick="filterCategory('All')" id="btn-cat-all" class="cat-btn active px-4 py-1.5 rounded-full text-[11px] font-semibold whitespace-nowrap bg-ink-900 text-cream-100 shadow-soft transition">Semua Menu</button>
        <button onclick="filterCategory('Snack')" class="cat-btn px-4 py-1.5 rounded-full text-[11px] font-medium whitespace-nowrap bg-white text-ink-700 border border-cream-200 hover:bg-cream-50 transition">Snack & Gorengan</button>
        <button onclick="filterCategory('Kue Basah')" class="cat-btn px-4 py-1.5 rounded-full text-[11px] font-medium whitespace-nowrap bg-white text-ink-700 border border-cream-200 hover:bg-cream-50 transition">Kue Basah</button>
      </div>

      <form action="javascript:void(0);" onsubmit="submitSearchOnEnter(event)" class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input type="text"
